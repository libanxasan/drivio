name: driving_telemetry_example
description: Example application for driving_telemetry.
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  driving_telemetry:
    path: ../
  http: ^1.6.0
  path_provider: ^2.1.6
  workmanager: ^0.10.10
  # 7.3.2 needs dbus 0.8, which conflicts with geolocator_linux.
  connectivity_plus: ">=7.3.1 <7.3.2"

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
